    <footer>
    </footer>
    <script src="../../app.js"></script>
    <script>
        const LOWS_GAMES = [
            { title: "Low's Adventure", url: "lows-adventure/lows-adventure-1.html", image: "Low's Adventure.png" },
            { title: "Low's Adventure 2", url: "lows-adventure/lows-adventure-2.html", image: "Low's Adventure 2.png" },
        ];

        function getFavorites() {
            return JSON.parse(localStorage.getItem('favoriteGames')) || [];
        }

        function isFavorited(title) {
            return getFavorites().some(fav => fav.title === title);
        }

        function toggleFavorite(game, btn) {
            let favs = getFavorites();
            const idx = favs.findIndex(f => f.title === game.title);
            if (idx > -1) {
                favs.splice(idx, 1);
                btn.innerHTML = '&#9734;';
                btn.classList.remove('favorited');
            } else {
                favs.push(game);
                btn.innerHTML = '&#9733;';
                btn.classList.add('favorited');
            }
            localStorage.setItem('favoriteGames', JSON.stringify(favs));
        }

        document.querySelectorAll('.lows-game-card').forEach((card, i) => {
            const game = LOWS_GAMES[i];
            const btn = document.createElement('button');
            btn.className = 'favorite-btn';
            btn.innerHTML = isFavorited(game.title) ? '&#9733;' : '&#9734;';
            if (isFavorited(game.title)) btn.classList.add('favorited');
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                toggleFavorite(game, btn);
            });
            card.appendChild(btn);
        });
    </script>
    <script>
        function openAboutBlank() {
            const w = window.open('about:blank', '_blank');
            const iframe = w.document.createElement('iframe');
            iframe.src = window.location.href;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:fixed;top:0;left:0;';
            w.document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;';
            w.document.body.appendChild(iframe);
        }
    </script>
</body>
