<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Santa Tracker - The Game Master</title>
    <link rel="icon" href="../assets/images/Game Masters Logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=14">
    <link rel="stylesheet" href="game-page.css?v=6">
</head>
<body>
    <header>
        <nav class="top-nav">
            <div class="nav-logo">
                <a href="../index.html">
                    <img src="../assets/images/Game Masters Logo.png" alt="The Game Master Logo" class="logo-img">
                    The Game Master
                </a>
            </div>
            <div class="nav-center">
            <button class="about-blank-btn" onclick="openAboutBlank()">Open in about:blank</button>
        </div>
        <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../games.html" class="active">Games</a>
                <a href="../forms.html">Forms</a>
                <a href="../cheats.html">Cheats</a>
            </div>
        </nav></header>
    <main class="game-page">
        <div class="game-container">
            <iframe src="https://santatracker.google.com/"
                    frameborder="0" 
                    allowfullscreen
                    allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">Play in Fullscreen</button>
        </div>
    </main>
    <footer>
        <p>Site Last Updated: 5/25/2026</p>
    </footer>    <script src="game-fullscreen.js?v=2"></script>
    <script src="../app.js"></script>
    <script>
        function openAboutBlank() {
            const w = window.open('about:blank', '_blank');
            const iframe = w.document.createElement('iframe');
            iframe.src = window.location.href;
            iframe.style.cssText = 'width:100%;height:100%;border:none;position:fixed;top:0;left:0;';
            w.document.body.style.cssText = 'margin:0;padding:0;overflow:hidden;';
            w.document.body.appendChild(iframe);
        }
    </script>
</body>
</html>
